name: vaachak_workspace
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
workspace:
  - packages/vaachak_engine
  - packages/vaachak_content
  - packages/vaachak_store
  - packages/vaachak_speech
  - packages/vaachak_explain
  - packages/vaachak_sync
  - packages/vaachak_packs
dev_dependencies:
  flutter_lints: 6.0.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
