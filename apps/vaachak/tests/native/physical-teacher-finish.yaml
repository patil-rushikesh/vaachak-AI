- tapOn: Library
- scrollUntilVisible:
    element: Voice reference library
    direction: UP
    timeout: 60000
- tapOn: Voice reference library
- scrollUntilVisible:
    element: Your voice library starts here
- assertVisible: Your voice library starts here
- tapOn: Open my account
- scrollUntilVisible:
    element: Saved drafts & archives
    direction: UP
    timeout: 60000
- tapOn: Saved drafts & archives
- assertVisible: Saved work
