name: Verify VaachakAI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tools/content_pipeline/requirements.txt
      - run: python3 tools/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-web
          path: apps/vaachak_app/build/web
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: python3 infra/supabase/render_migration.py && git diff --exit-code infra/supabase/migrations
      - run: docker exec --user root ${{ job.services.postgres.id }} sh -c 'apt-get update && apt-get install -y postgresql-16-pgtap'
      - run: python3 tools/sql_check.py --bootstrap
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: apps/vaachak_app
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/vaachak_app/build/app/outputs/flutter-apk/app-debug.apk
