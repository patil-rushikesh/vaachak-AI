name: Verify VaachakAI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install -r tools/content_pipeline/requirements.txt -r classroom_web/requirements-dev.txt
      - run: python3 tools/check.py
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: python3 infra/supabase/render_migration.py && git diff --exit-code infra/supabase/migrations
      - run: docker exec --user root ${{ job.services.postgres.id }} sh -c 'apt-get update && apt-get install -y postgresql-16-pgtap'
      - run: python3 tools/sql_check.py --bootstrap

  classroom-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r classroom_web/requirements-dev.txt
      - run: python -m pytest classroom_web/tests -q --junitxml=docs/verification/backend-tests.xml
      - run: python tools/export_postman.py && python tools/build_postman_smoke.py
      - run: docker build -f deploy/backend/Dockerfile -t vaachak-backend:ci .
      - run: python tools/release_container_check.py --image vaachak-backend:ci --report docs/verification/release-container.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            docs/verification/backend-tests.xml
            docs/verification/backend-endpoint-coverage.json
            docs/verification/release-container.json

  classroom-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: vaachak-test-only
          POSTGRES_DB: vaachak_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VAACHAK_TEST_DATABASE_URL: postgresql://postgres:vaachak-test-only@127.0.0.1:5432/vaachak_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r classroom_web/requirements-dev.txt
      - run: python -m pytest classroom_web/tests -q --junitxml=docs/verification/backend-postgres-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-verification
          path: |
            docs/verification/backend-postgres-tests.xml
            docs/verification/backend-endpoint-coverage-postgres.json
