services:
  api:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    environment:
      VAACHAK_ENV: production
      VAACHAK_DATA: /data
      VAACHAK_TEACHER_INVITE: ${VAACHAK_TEACHER_INVITE:?Set instructor invitation in deployment environment}
      VAACHAK_SMTP_HOST: ${VAACHAK_SMTP_HOST:-}
      VAACHAK_SMTP_PORT: ${VAACHAK_SMTP_PORT:-587}
      VAACHAK_SMTP_FROM: ${VAACHAK_SMTP_FROM:-}
      VAACHAK_SMTP_USER: ${VAACHAK_SMTP_USER:-}
      VAACHAK_SMTP_PASSWORD: ${VAACHAK_SMTP_PASSWORD:-}
      VAACHAK_GENERATION_DAILY_JOBS: ${VAACHAK_GENERATION_DAILY_JOBS:-50}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VAACHAK_CHAT_MODEL: ${VAACHAK_CHAT_MODEL:-}
      VAACHAK_ASR_MODEL: ${VAACHAK_ASR_MODEL:-}
    volumes:
      - data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
  worker:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    command: ["python", "tools/learning_worker.py"]
    environment:
      VAACHAK_DATA: /data
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VAACHAK_CHAT_MODEL: ${VAACHAK_CHAT_MODEL:-}
    volumes: ["data:/data"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      disable: true
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }
  proxy:
    image: caddy:2.10
    environment:
      DOMAIN: ${DOMAIN:?Set a DNS hostname pointing to this host}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  data:
  caddy_data:
  caddy_config:
